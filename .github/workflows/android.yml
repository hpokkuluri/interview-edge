# Builds the Android test app (APK) with every question bundled inside, and posts it
# to the "android-test" release so it can be downloaded straight to a phone.
name: Android test build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'src/**', 'tools/**']
permissions:
  contents: write
concurrency: { group: android, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - name: Build APK
        working-directory: android-app
        run: |
          npm install --no-audit --no-fund
          node copy-web.js
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#0E1B3D' --iconBackgroundColorDark '#0E1B3D' --splashBackgroundColor '#0E1B3D' --splashBackgroundColorDark '#0E1B3D'
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon -q
          cp app/build/outputs/apk/debug/app-debug.apk ../InterviewEdge-test.apk
      - name: Publish test APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-test -y --cleanup-tag || true
          gh release create android-test android-app/InterviewEdge-test.apk --prerelease \
            --title "Interview Edge — Android test build" \
            --notes "Test build from ${GITHUB_SHA::7}. Install on an Android phone (allow installs from your browser). Upgrade works in test mode without payment."
