name: probe
on: { push: { branches: [edge-ai-probe] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s https://dl.google.com/android/maven2/com/google/ai/edge/litertlm/litertlm-android/maven-metadata.xml | head -40
          curl -s "https://huggingface.co/api/models?author=litert-community&search=gemma&limit=50" | python3 -c "import sys,json;[print(m['id'],m.get('gated')) for m in json.load(sys.stdin)]"
          for m in litert-community/Gemma3-1B-IT litert-community/gemma-3-270m-it litert-community/Gemma3-270M-IT litert-community/gemma-3n-E2B-it-litert-lm litert-community/Qwen2.5-1.5B-Instruct; do echo "== $m"; curl -s "https://huggingface.co/api/models/$m?blobs=true" | python3 -c "import sys,json;d=json.load(sys.stdin);print('gated',d.get('gated'));[print(s['rfilename'],s.get('size')) for s in d.get('siblings',[]) if s['rfilename'].endswith(('.litertlm','.task'))]" || true; done
          ls /usr/local/lib/android/sdk/system-images 2>/dev/null; ls /usr/local/lib/android/sdk/platforms; ls -la /dev/kvm
