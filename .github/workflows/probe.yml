name: probe
on: { push: { branches: [edge-ai-probe] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for m in litert-community/gemma-4-E2B-it-litert-lm litert-community/gemma-4-E4B-it-litert-lm; do echo "== $m"; curl -s "https://huggingface.co/api/models/$m?blobs=true" | python3 -c "import sys,json;d=json.load(sys.stdin);print('gated',d.get('gated'),d.get('cardData',{}).get('license'));[print(s['rfilename'],s.get('size')) for s in d.get('siblings',[])]" || true; done
          for u in litert-community/gemma-3-270m-it/resolve/main/gemma3-270m-it-q8.litertlm litert-community/Gemma3-1B-IT/resolve/main/gemma3-1b-it-int4.litertlm; do echo "$u $(curl -sIL -o /dev/null -w '%{http_code}' https://huggingface.co/$u)"; done
          f=$(curl -s "https://huggingface.co/api/models/litert-community/gemma-4-E2B-it-litert-lm" | python3 -c "import sys,json;print([s['rfilename'] for s in json.load(sys.stdin)['siblings'] if s['rfilename'].endswith('.litertlm')][0])"); echo "E2B file $f $(curl -sIL -o /dev/null -w '%{http_code}' https://huggingface.co/litert-community/gemma-4-E2B-it-litert-lm/resolve/main/$f)"
          echo free RAM; free -g; nproc
