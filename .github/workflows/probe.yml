name: probe
on: { push: { branches: [voice-probe] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -x
          curl -s https://api.github.com/repos/k2-fsa/sherpa-onnx/releases/latest | python3 -c "import sys,json;d=json.load(sys.stdin);print(d['tag_name']);[print(a['name'],a['size']) for a in d['assets'] if a['name'].endswith('.aar')]"
          curl -s "https://api.github.com/repos/k2-fsa/sherpa-onnx/releases/tags/tts-models" > t.json
          python3 -c "import json;d=json.load(open('t.json'));[print(a['name'],a['size']) for a in d['assets'] if 'kokoro' in a['name']]"
          TAG=$(curl -s https://api.github.com/repos/k2-fsa/sherpa-onnx/releases/latest | python3 -c "import sys,json;print(json.load(sys.stdin)['tag_name'])")
          V=${TAG#v}
          curl -sLo s.aar "https://github.com/k2-fsa/sherpa-onnx/releases/download/$TAG/sherpa-onnx-static-link-onnxruntime-$V.aar" || true
          ls -l s.aar; unzip -l s.aar | head -30
          mkdir a && cd a && unzip -q ../s.aar && unzip -q classes.jar -d cls && ls cls/com/k2fsa/sherpa/onnx | grep -i -E "tts|Kokoro|GeneratedAudio" 
          for c in OfflineTts OfflineTtsConfig OfflineTtsModelConfig OfflineTtsKokoroModelConfig GeneratedAudio; do javap -cp cls com.k2fsa.sherpa.onnx.$c; done
          cd ..; curl -sL https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/kokoro-int8-multi-lang-v1_0.tar.bz2 | tar tjv | head -40
